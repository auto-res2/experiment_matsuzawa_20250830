# Energy-Adaptive FlashAttention (T4) experiment config
experiment_name: eafa_t4
model_name: gpt2
seq_len: 512

# Training
train_steps: 50
warmup_steps: 5
lr: 5e-5
weight_decay: 0.0
train_batch_size: 2
grad_accum_steps: 1

# Evaluation
eval_batch_size: 4
eval_warmup_batches: 3
eval_measure_batches: 10

data_dir: data
model_dir: models
device: cuda
seed: 42
gpu_index: 0

# Energy-Aware knobs
enable_mpts: true
enable_skp: true
