# Lightweight configuration for the LoRA-Prop (+ Time-Warp) toy experiment
# Run from project root: python -m src.main --config config/experiment.yaml

device: cpu  # set to "cuda" if an NVIDIA GPU (e.g., Tesla T4) is available

total_steps: 10
key_K: 3
rank: 8

train:
  epochs: 3
  batch_size: 16
  lr: 0.001
  n_images: 32

seeds: [0, 1]

images_out_dir: .research/iteration9/images
models_out_dir: models
models_ckpt_name: loraprop_toy.pt
