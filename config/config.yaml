# Minimal configuration for the synthetic LoRA-Prop (+ Time-Warp) experiment
seed: 123
# Device will default to CUDA if available; override here if needed
device: cuda

# Dry pass for ΔF and key-step discovery
T_dry: 20         # total steps in the synthetic timeline
K_keys: 3         # number of key steps to select
deltaF_batch: 8   # batch size during ΔF dry run

# Training LoRA-Prop adapters
train_iters: 200
train_lr: 5.0e-4
train_batch: 8
rank: 8

# Paths
results_dir: results
images_dir: .research/iteration8/images
model_save_path: models/loraprop_lightpath.pt
