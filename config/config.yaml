# Default experiment configuration for EA-FA T4 experiments

# IO directories
output_dir: .research/iteration4
images_dir: .research/iteration4/images
models_dir: ./models
data_dir: ./data

# Preprocessing
tokenizer_name: gpt2
tokens_filename: wikitext103_gpt2_tokens.npy

# Model
model_name: gpt2
device_index: 0

# Optional tiny finetuning (disabled by default to save compute)
do_train: false
train_seq_len: 128
train_batch_size: 4
train_steps: 20
lr: 5e-5
warmup_steps: 5
weight_decay: 0.01

# Evaluation sweep
seq_lens: [512, 1024]
seeds: [11, 13]
backends: [mem_efficient, math, eafa]  # xformers is optional and used if installed
max_batches: 20
idle_seconds: 10.0

# Target tokens budget per batch-size search (B*L ~= tokens_budget)
tokens_budget: 16000
